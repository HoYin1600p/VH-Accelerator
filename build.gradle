buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory = project.file('run/client')
        }

        server {
            workingDirectory = project.file('run/server')
            args '--nogui'
        }

        data {
            workingDirectory = project.file('run/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
}

def localCompileDependency = { String fileName ->
    def dependencyFile = file("libs/${fileName}")
    if (!dependencyFile.exists()) {
        throw new GradleException(
                "Missing local compile dependency ${dependencyFile.name}. " +
                "See libs/README.md for the pinned files."
        )
    }
    return dependencyFile
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional at runtime. These jars expose only the APIs targeted by guarded
    // compatibility mixins and are deliberately not bundled in our output jar.
    compileOnly files(localCompileDependency('the_vault-1.18.2-20.0.3-remastered.6872.jar'))
    compileOnly files(localCompileDependency('jei-1.18.2-forge-10.2.1.1009.jar'))
    compileOnly files(localCompileDependency('Powah-3.0.8.jar'))
    compileOnly files(localCompileDependency('JEITweaker-1.18.2-3.0.0.9.jar'))
    compileOnly files(localCompileDependency('CraftTweaker-forge-1.18.2-9.1.213.jar'))
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyMixinPackageLayout') {
    group = 'verification'
    description = 'Rejects nested helper classes compiled inside the reserved Mixin package.'
    dependsOn tasks.named('classes')

    doLast {
        def nestedMixinClasses = fileTree(
                layout.buildDirectory.dir(
                        'classes/java/main/dev/hoyin1600p/launchfastertoo/mixin'
                )
        ) {
            include '**/*$*.class'
        }

        if (!nestedMixinClasses.isEmpty()) {
            def relativeNames = nestedMixinClasses.files.collect {
                layout.buildDirectory.get().asFile.toPath().relativize(it.toPath())
            }.sort()
            throw new GradleException(
                    'Nested classes cannot live in the reserved Mixin package: ' +
                    relativeNames.join(', ')
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyMixinPackageLayout')
}
