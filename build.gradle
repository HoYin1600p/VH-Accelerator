buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_artifact_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory = project.file('run/client')
        }

        server {
            workingDirectory = project.file('run/server')
            args '--nogui'
        }

        data {
            workingDirectory = project.file('run/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
}

def localCompileDependency = { String fileName ->
    def dependencyFile = file("libs/${fileName}")
    if (!dependencyFile.exists()) {
        throw new GradleException(
                "Missing local compile dependency ${dependencyFile.name}. " +
                "See libs/README.md for the pinned files."
        )
    }
    return dependencyFile
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional at runtime. These jars expose only the APIs targeted by guarded
    // compatibility mixins and are deliberately not bundled in our output jar.
    compileOnly files(localCompileDependency('the_vault-1.18.2-20.0.3-remastered.6872.jar'))
    compileOnly files(localCompileDependency('jei-1.18.2-forge-10.2.1.1009.jar'))
    compileOnly files(localCompileDependency('jei-1.18.2-9.7.2.1001.jar'))
    compileOnly files(localCompileDependency('Powah-3.0.8.jar'))
    compileOnly files(localCompileDependency('JEITweaker-1.18.2-3.0.0.9.jar'))
    compileOnly files(localCompileDependency('CraftTweaker-forge-1.18.2-9.1.213.jar'))
    compileOnly files(localCompileDependency('thermal_foundation-1.18.2-9.2.2.58.jar'))
    compileOnly files(localCompileDependency('JustEnoughResources-1.18.2-0.14.2.206.jar'))
    compileOnly files(localCompileDependency('ironfurnaces-1.18.2-3.3.3.jar'))
    compileOnly files(localCompileDependency('industrial-foregoing-1.18.2-3.3.1.7-11.jar'))
    compileOnly files(localCompileDependency('Xaeros_Minimap_25.2.10_Forge_1.18.2.jar'))
    compileOnly files(localCompileDependency('XaerosWorldMap_1.39.12_Forge_1.18.2.jar'))
}

def compatibilityProfiles = [
        remastered: [
                vault  : 'the_vault-1.18.2-20.0.3-remastered.6872.jar',
                jei    : 'jei-1.18.2-forge-10.2.1.1009.jar',
                exclude: '**/compat/jei/v9/**'
        ],
        mvp       : [
                vault  : 'the_vault-1.18.2-3.21.62.jar',
                jei    : 'jei-1.18.2-9.7.2.1001.jar',
                exclude: '**/compat/jei/v10/**'
        ],
        official  : [
                vault  : 'the_vault-1.18.2-3.21.6.6884.jar',
                jei    : 'jei-1.18.2-9.7.2.1001.jar',
                exclude: '**/compat/jei/v10/**'
        ],
        previousOfficial: [
                vault  : 'the_vault-1.18.2-3.21.5.6882.jar',
                jei    : 'jei-1.18.2-9.7.2.1001.jar',
                exclude: '**/compat/jei/v10/**'
        ]
]

def compatibilityDependencyNames = compatibilityProfiles.values().collectMany {
    [it.vault, it.jei]
}.toSet()
def compatibilityCompileTasks = []

compatibilityProfiles.each { profileName, profile ->
    def taskName = "compile${profileName.capitalize()}Compatibility"
    compatibilityCompileTasks << tasks.register(taskName, JavaCompile) {
        group = 'verification'
        description = "Compiles the universal sources against the ${profileName} dependency profile."

        source = fileTree('src/main/java') {
            exclude profile.exclude
        }
        classpath = sourceSets.main.compileClasspath.filter {
            !compatibilityDependencyNames.contains(it.name)
        } + files(
                localCompileDependency(profile.vault),
                localCompileDependency(profile.jei)
        )
        destinationDirectory = layout.buildDirectory.dir(
                "compatibility/${profileName}/classes"
        )
        options.compilerArgs.add('-proc:none')
    }
}

tasks.register('verifyUnifiedCompatibilityJar') {
    group = 'verification'
    description = 'Checks that one output jar contains both JEI compatibility generations.'
    dependsOn tasks.named('jar')

    doLast {
        def outputJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(outputJar)
        try {
            def requiredEntries = [
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/AdaptiveJeiWorkScheduler.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/DeferredIngredientMutations.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/EmptyJeiBlacklist.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/InitialJeiVisibilityFastPath.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/ParallelJeiPrefixIndexer.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/PersistentJeiRecipeIndexCache.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/PersistentVanillaIngredientCache.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/VanillaRecipeValidation.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/v9/RecipeMapIndexAccess.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jei/v10/RecipeMapIndexAccess.class',
                    'dev/hoyin1600p/vhaccelerator/client/cache/ClientAssetFingerprint.class',
                    'dev/hoyin1600p/vhaccelerator/client/cache/PersistentModelJsonCache.class',
                    'dev/hoyin1600p/vhaccelerator/client/PacketDecodeProfiler.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/IngredientFilterMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/IngredientBlacklistInternalMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/IngredientManagerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/IngredientVisibilityMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/ItemStackListFactoryMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/EditModeConfigMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/RecipeMapIndexMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/RecipeManagerInternalIndexMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/IngredientFilterMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/IngredientBlacklistInternalMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/IngredientManagerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/IngredientVisibilityMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/ItemStackListFactoryMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/EditModeConfigMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/RecipeMapIndexMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/RecipeManagerInternalIndexMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/VanillaRecipesMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/VanillaRecipesMixin.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/jer/JerCompatibilityCache.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/crafttweaker/ParallelCraftTweakerTagBinding.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/crafttweaker/CraftTweakerClientReplay.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/thermal/ParallelThermalRecipeRefresh.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/thermal/PersistentStirlingFuelCache.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/thermal/ThermalRefreshPhase.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/ironfurnaces/IronFurnacesRecipeCache.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/industrialforegoing/IndustrialForegoingStoneWorkOptimizer.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jer/JeiConfigMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/crafttweaker/CraftTweakerTagRegistryMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/crafttweaker/ExecutingScriptRunnerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/crafttweaker/RecipeManagerScriptLoaderMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/crafttweaker/ScriptRunManagerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/crafttweaker/ScriptRunnerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/crafttweaker/ThroughRecipeScriptRunManagerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/thermal/ThermalRecipeManagersMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/thermal/SingleItemFuelManagerAccessor.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/thermal/StirlingFuelManagerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/ironfurnaces/IronFurnacesJeiPluginMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/industrialforegoing/IndustrialForegoingJeiPluginMixin.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/xaero/XaeroOnlineCheckDeferrer.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/vaulthunters/DeferredVaultAtlasUpload.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/vaulthunters/DeferredVaultAtlasUploads.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/xaero/XaeroMinimapOnlineChecksMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/xaero/XaeroWorldMapOnlineChecksMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ConnectionProtocolMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModernFixCompatibleModelBakingMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModernFixCompatibleModelJsonCacheMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ReloadListenerProfilerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/vaulthunters/AbstractTextureAtlasHolderMixin.class',
                    'vhaccelerator.mixins.json'
            ]
            def missingEntries = requiredEntries.findAll {
                archive.getEntry(it) == null
            }
            if (!missingEntries.isEmpty()) {
                throw new GradleException(
                        'Universal compatibility classes are missing from the jar: ' +
                                missingEntries.join(', ')
                )
            }

            def removedMainThreadRouters = [
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/PluginCallerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/PluginCallerMixin.class'
            ]
            def presentMainThreadRouters = removedMainThreadRouters.findAll {
                archive.getEntry(it) != null
            }
            if (!presentMainThreadRouters.isEmpty()) {
                throw new GradleException(
                        'The jar still contains blanket JEI main-thread routing: ' +
                                presentMainThreadRouters.join(', ')
                )
            }

            def mixinConfig = archive.getInputStream(
                    archive.getEntry('vhaccelerator.mixins.json')
            ).getText('UTF-8')
            def parsedMixinConfig =
                    new groovy.json.JsonSlurper().parseText(mixinConfig)
            def configuredMixinSimpleNames = (
                    (parsedMixinConfig.mixins ?: []) +
                            (parsedMixinConfig.client ?: []) +
                            (parsedMixinConfig.server ?: [])
            ).collect { it.tokenize('.').last() }.toSet()
            def removedWholeStartupMixins = [
                    'ClientLifecycleHandlerMixin',
                    'InternalMixin',
                    'JeiStarterMixin',
                    'PluginLoaderMixin',
                    'PluginCallerSelectiveMixin'
            ].findAll { configuredMixinSimpleNames.contains(it) }
            if (!removedWholeStartupMixins.isEmpty()) {
                throw new GradleException(
                        'Whole-startup JEI worker mixins are still active: ' +
                                removedWholeStartupMixins.join(', ')
                )
            }

            def bundledDependencies = archive.entries().toList().findAll {
                it.name.startsWith('mezz/jei/') ||
                        it.name.startsWith('iskallia/vault/') ||
                        it.name.startsWith('cofh/thermal/') ||
                        it.name.startsWith('com/blamejared/crafttweaker/') ||
                        it.name.startsWith('xaero/')
            }
            if (!bundledDependencies.isEmpty()) {
                throw new GradleException(
                        'The output jar must not bundle optional mod classes.'
                )
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyMixinPackageLayout') {
    group = 'verification'
    description = 'Rejects nested helper classes compiled inside the reserved Mixin package.'
    dependsOn tasks.named('classes')

    doLast {
        def nestedMixinClasses = fileTree(
                layout.buildDirectory.dir(
                        'classes/java/main/dev/hoyin1600p/vhaccelerator/mixin'
                )
        ) {
            include '**/*$*.class'
        }

        if (!nestedMixinClasses.isEmpty()) {
            def relativeNames = nestedMixinClasses.files.collect {
                layout.buildDirectory.get().asFile.toPath().relativize(it.toPath())
            }.sort()
            throw new GradleException(
                    'Nested classes cannot live in the reserved Mixin package: ' +
                    relativeNames.join(', ')
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyMixinPackageLayout')
    dependsOn compatibilityCompileTasks
    dependsOn tasks.named('verifyUnifiedCompatibilityJar')
}
