                    'dev/hoyin1600p/vhaccelerator/mixin/compat/xaero/XaeroWorldMapOnlineChecksMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/sophisticated/StorageScreenBaseMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/sophisticated/SettingsScreenMixin.class',
                    'dev/hoyin1600p/vhaccelerator/client/compat/sophisticated/VaultSigilSlotRenderer.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ConnectionProtocolMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/JeiStartEventObserverMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModernFixCompatibleModelBakingMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModernFixCompatibleModelJsonCacheMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ClientModLoaderProfilerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModelBakeryCapacityMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModelBakeryLoadProfilerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ModelBakeryTopLevelCacheMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/client/ReloadListenerProfilerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/vaulthunters/AbstractTextureAtlasHolderMixin.class',
                    'META-INF/LICENSE',
                    'META-INF/THIRD_PARTY_NOTICES.md',
                    'META-INF/CREDITS.md',
                    'META-INF/MODERNFIX_BACKPORTS.md',
                    'vhaccelerator.mixins.json'
            ]
            def missingEntries = requiredEntries.findAll {
                archive.getEntry(it) == null
            }
            if (!missingEntries.isEmpty()) {
                throw new GradleException(
                        'Universal compatibility classes are missing from the jar: ' +
                                missingEntries.join(', ')
                )
            }

            def removedMainThreadRouters = [
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v9/PluginCallerMixin.class',
                    'dev/hoyin1600p/vhaccelerator/mixin/compat/jei/v10/PluginCallerMixin.class'
            ]
            def presentMainThreadRouters = removedMainThreadRouters.findAll {
                archive.getEntry(it) != null
            }
            if (!presentMainThreadRouters.isEmpty()) {
                throw new GradleException(
                        'The jar still contains blanket JEI main-thread routing: ' +
                                presentMainThreadRouters.join(', ')
                )
            }

            def mixinConfig = archive.getInputStream(
                    archive.getEntry('vhaccelerator.mixins.json')
            ).getText('UTF-8')
            def parsedMixinConfig =
                    new groovy.json.JsonSlurper().parseText(mixinConfig)
            def configuredMixinSimpleNames = (
                    (parsedMixinConfig.mixins ?: []) +
                            (parsedMixinConfig.client ?: []) +
                            (parsedMixinConfig.server ?: [])
            ).collect { it.tokenize('.').last() }.toSet()
            def removedWholeStartupMixins = [
                    'ClientLifecycleHandlerMixin',
                    'InternalMixin',
                    'JeiStarterMixin',
                    'PluginLoaderMixin',
                    'PluginCallerSelectiveMixin'
            ].findAll { configuredMixinSimpleNames.contains(it) }
            if (!removedWholeStartupMixins.isEmpty()) {
                throw new GradleException(
                        'Whole-startup JEI worker mixins are still active: ' +
                                removedWholeStartupMixins.join(', ')
                )
            }

            def bundledDependencies = archive.entries().toList().findAll {
                it.name.startsWith('mezz/jei/') ||
                        it.name.startsWith('iskallia/vault/') ||
                        it.name.startsWith('net/p3pp3rf1y/sophisticatedcore/') ||
                        it.name.startsWith('cofh/thermal/') ||
                        it.name.startsWith('com/blamejared/crafttweaker/') ||
                        it.name.startsWith('xaero/')
            }
            if (!bundledDependencies.isEmpty()) {
                throw new GradleException(
                        'The output jar must not bundle optional mod classes.'
                )
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('CREDITS.md') {
        into 'META-INF'
    }
    from('docs/MODERNFIX_BACKPORTS.md') {
        into 'META-INF'
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('CREDITS.md') {
        into 'META-INF'
    }
    from('docs/MODERNFIX_BACKPORTS.md') {
        into 'META-INF'
    }
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyMixinPackageLayout') {
    group = 'verification'
    description = 'Rejects nested helper classes compiled inside the reserved Mixin package.'
    dependsOn tasks.named('classes')

    doLast {
        def nestedMixinClasses = layout.buildDirectory.dir(
                'classes/java/main/dev/hoyin1600p/vhaccelerator/mixin'
        ).get().asFileTree.matching {
            include '**/*$*.class'
        }

        if (!nestedMixinClasses.isEmpty()) {
            def relativeNames = nestedMixinClasses.files.collect {
                layout.buildDirectory.get().asFile.toPath().relativize(it.toPath())
            }.sort()
            throw new GradleException(
                    'Nested classes cannot live in the reserved Mixin package: ' +
                    relativeNames.join(', ')
            )
        }
    }
}

tasks.register('verifyMixinInitializationSafety') {
    group = 'verification'
    description = 'Rejects static initializers in configured mixins.'
    dependsOn tasks.named('classes')

    doLast {
        def mixinConfigFile = file(
                'src/main/resources/vhaccelerator.mixins.json'
        )
        def mixinConfig = new groovy.json.JsonSlurper().parse(
                mixinConfigFile,
                'UTF-8'
        )
        def packagePath = mixinConfig.package.replace('.', '/')
        def configuredMixins = (
                (mixinConfig.mixins ?: []) +
                        (mixinConfig.client ?: []) +
                        (mixinConfig.server ?: [])
        )
        def classesRoot = layout.buildDirectory.dir(
                'classes/java/main'
        ).get().asFile
        def hasClassInitializer = { byte[] classBytes ->
            def classNode = new org.objectweb.asm.tree.ClassNode()
            new org.objectweb.asm.ClassReader(classBytes).accept(
                    classNode,
                    org.objectweb.asm.ClassReader.SKIP_CODE |
                            org.objectweb.asm.ClassReader.SKIP_DEBUG |
                            org.objectweb.asm.ClassReader.SKIP_FRAMES
            )
            return classNode.methods.any { method ->
                method.name == '<clinit>'
            }
        }

        def missingClasses = []
        def staticInitializers = []
        configuredMixins.each { mixinName ->
            def classFile = new File(
                    classesRoot,
                    "${packagePath}/${mixinName.replace('.', '/')}.class"
            )
            if (!classFile.isFile()) {
                missingClasses << mixinName
            } else if (hasClassInitializer(classFile.bytes)) {
                staticInitializers << mixinName
            }
        }

        if (!missingClasses.isEmpty()) {
            throw new GradleException(
                    'Configured mixin classes are missing: ' +
                            missingClasses.sort().join(', ')
            )
        }
        if (!staticInitializers.isEmpty()) {
            throw new GradleException(
                    'Configured mixins must not emit <clinit>; move initialized ' +
                            'static state to a normal holder class or use safe ' +
                            'JVM defaults: ' +
                            staticInitializers.sort().join(', ')
            )
        }
    }
}

tasks.register('verifyModernFixBackportProvenance') {
    group = 'verification'
    description = 'Rejects ModernFix-derived source without complete provenance headers.'

    doLast {
        def roots = [
                file('src/main/java/dev/hoyin1600p/vhaccelerator/backport/modernfix'),
                file('src/main/java/dev/hoyin1600p/vhaccelerator/mixin/backport/modernfix')
        ]
        def requiredText = [
                'SPDX-License-Identifier: LGPL-3.0-or-later',
                'Upstream repository: https://github.com/embeddedt/ModernFix',
                'Upstream source:',
                'Original copyright:',
                'VH Accelerator modifications:',
                'Modified:'
        ]
        def failures = []

        roots.findAll { it.isDirectory() }.each { root ->
            root.traverse(type: groovy.io.FileType.FILES, nameFilter: ~/.*\.java/) { sourceFile ->
                def sourceText = sourceFile.getText('UTF-8')
                def missing = requiredText.findAll {
                    !sourceText.contains(it)
                }
                if (!(sourceText =~ /Upstream commit:\s*[0-9a-fA-F]{40}/).find()) {
                    missing << 'Upstream commit: <full 40-character commit ID>'
                }
                if (!missing.isEmpty()) {
                    failures << "${project.relativePath(sourceFile)}: ${missing.join(', ')}"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'ModernFix backport provenance is incomplete:\n' +
                            failures.sort().join('\n')
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyMixinPackageLayout')
    dependsOn tasks.named('verifyMixinInitializationSafety')
    dependsOn tasks.named('verifyModernFixBackportProvenance')
    dependsOn compatibilityCompileTasks
    dependsOn tasks.named('verifyUnifiedCompatibilityJar')
}
